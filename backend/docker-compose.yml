# RKOS 后端服务 - 开发环境 Docker Compose 编排
# 用法：在 backend/ 目录执行 docker compose up

services:
  # ---------- Spring Boot 应用 ----------
  rkos-backend:
    build: .
    container_name: rkos-backend
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # MongoDB 连接（容器内使用服务名）
      SPRING_DATA_MONGODB_HOST: rkos-mongodb
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: ${MONGO_DB:-rkos_dev}
      # PostgreSQL 连接（容器内使用服务名）
      SPRING_DATASOURCE_URL: jdbc:postgresql://rkos-postgresql:5432/${POSTGRES_DB:-rkos_dev}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dev_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      # 应用 API Key
      RKOS_API_KEY: ${RKOS_API_KEY:-dev-api-key-12345}
    depends_on:
      rkos-mongodb:
        condition: service_healthy
      rkos-postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - rkos-network

  # ---------- MongoDB ----------
  rkos-mongodb:
    image: mongo:7
    container_name: rkos-mongodb
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-rkos_dev}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rkos-network

  # ---------- PostgreSQL ----------
  rkos-postgresql:
    image: postgres:16
    container_name: rkos-postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rkos_dev}
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev_user} -d ${POSTGRES_DB:-rkos_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rkos-network

networks:
  rkos-network:
    driver: bridge

volumes:
  mongo-data:
  pg-data:
