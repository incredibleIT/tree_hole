# RKOS 后端服务 - 生产环境配置
spring:
  data:
    mongodb:
      host: mongodb-service
      port: 27017
      database: rkos_prod
  datasource:
    url: jdbc:postgresql://postgresql-service:5432/rkos_prod
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Spring AI 配置（生产环境通过环境变量注入）
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      connect-timeout: 10s
      read-timeout: 120s
      chat:
        options:
          model: ${OPENAI_MODEL:qwen-max}

# MyBatis-Plus 配置（生产环境）
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.rkos.modules.*.model
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: WARN
    com.rkos: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

rkos:
  api:
    key: ${RKOS_API_KEY}
