# RKOS 后端服务 - 公共配置
server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: rkos-backend
  # Spring Boot 4.x 默认使用 Jackson 3.x (tools.jackson)，
  # Jackson 2.x ObjectMapper 由 Jackson2Config 手动注册
  # 主配置中不设置数据库连接，由各 profile 单独配置

# API Key 认证开关
rkos:
  api:
    enabled: true
  prompts:
    base-path: classpath:/prompts/

# springdoc OpenAPI 文档配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-produces-media-type: application/json

# Actuator 管理端点基础配置
management:
  endpoint:
    health:
      show-details: when-authorized
  endpoints:
    web:
      base-path: /actuator
